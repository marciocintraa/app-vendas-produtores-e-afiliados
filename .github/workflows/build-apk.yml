name: Build Android APK

# Gera automaticamente o APK do Vende Fácil Pro toda vez que você fizer
# push na branch main. O arquivo .apk fica disponível em:
#   - Actions → o run mais recente → Artifacts (app-debug.apk)
#   - Releases → tag "latest-apk" (para link direto de download)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save \
            @capacitor/core@^6 \
            @capacitor/cli@^6 \
            @capacitor/android@^6

      - name: Add Android platform
        run: npx cap add android || echo "Android platform already exists"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vende-facil-pro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Vende Fácil Pro — APK mais recente
          files: android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
          make_latest: true
