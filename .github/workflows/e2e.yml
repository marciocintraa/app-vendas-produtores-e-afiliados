name: E2E (Playwright)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cover-shortcuts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    name: cover-shortcuts (${{ matrix.browser }})
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app deps
        run: bun install --frozen-lockfile

      - name: Install Playwright (Python) + ${{ matrix.browser }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Start dev server
        run: |
          bun run dev > /tmp/dev-server.log 2>&1 &
          echo $! > /tmp/dev-server.pid
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/ && exit 0
            sleep 1
          done
          echo "Dev server failed to start" >&2
          cat /tmp/dev-server.log
          exit 1

      - name: Run E2E cover-shortcuts suite (${{ matrix.browser }})
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
        run: python3 tests/e2e/cover-shortcuts.spec.py

      - name: Upload failure artifacts (screenshots + trace.zip)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ matrix.browser }}
          path: |
            /tmp/browser/
            /tmp/dev-server.log
          if-no-files-found: ignore

      - name: Stop dev server
        if: always()
        run: kill $(cat /tmp/dev-server.pid) || true
